<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
      <h2 class="fw-bold mb-1">Products Catalog</h2>
      <p class="text-muted mb-0">Showing {{ products.length }} available items</p>
    </div>
    <a routerLink="/add-product" class="btn btn-primary">
      + Add New Product
    </a>
  </div>

  <!-- State 1: Loading Spinner -->
  <div *ngIf="isLoading" class="text-center py-5 my-4 bg-white rounded-4 shadow-sm">
    <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;">
      <span class="visually-hidden">Loading...</span>
    </div>
    <h5 class="text-muted">Loading products from server...</h5>
  </div>

  <!-- State 2: Error Message with Retry Button -->
  <div *ngIf="!isLoading && errorMessage" class="alert alert-danger p-4 rounded-4 shadow-sm text-center">
    <h5 class="fw-bold mb-2">Oops! Something went wrong</h5>
    <p class="mb-3">{{ errorMessage }}</p>
    <button type="button" class="btn btn-danger px-4" (click)="retryLoad()">
      Retry Again
    </button>
  </div>

  <!-- State 3: Empty Products List -->
  <div *ngIf="!isLoading && !errorMessage && products.length === 0" class="text-center py-5 bg-white rounded-4 shadow-sm border">
    <h4 class="fw-bold text-secondary mb-2">No products found</h4>
    <p class="text-muted mb-4">There are currently no products in the catalog.</p>
    <div class="d-flex justify-content-center gap-2">
      <a routerLink="/add-product" class="btn btn-primary">Add First Product</a>
      <button type="button" class="btn btn-outline-secondary" (click)="retryLoad()">Reload Default Products</button>
    </div>
  </div>

  <!-- Products Grid -->
  <div *ngIf="!isLoading && !errorMessage && products.length > 0" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
    <div class="col" *ngFor="let item of products">
      <app-product-card
        [product]="item"
        (deleteRequest)="handleDeleteProduct($event)">
      </app-product-card>
    </div>
  </div>
</div>
